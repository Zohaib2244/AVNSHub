<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NutBot · Expression Lab</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #13100c;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: 'JetBrains Mono', 'Courier New', monospace;
  color: #e8dfc8;
  gap: 28px;
  padding: 48px 20px;
}

.title {
  font-family: 'DotGothic16', monospace;
  font-size: 1.25rem;
  color: #ff6b2b;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

/* ─── Robot body ──────────────────────────────────── */
.nutbot {
  display: flex;
  flex-direction: column;
  align-items: center;
  filter: drop-shadow(6px 6px 0 #070604);
  animation: float 3.2s ease-in-out infinite;
}
@keyframes float  { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)} }
.nutbot.bounce    { animation: bounce .38s ease-in-out infinite; }
@keyframes bounce { 0%,100%{transform:translateY(0) rotate(-2deg)} 50%{transform:translateY(-14px) rotate(2deg)} }
.nutbot.tilt      { animation: tilt 2.2s ease-in-out infinite; }
@keyframes tilt   { 0%,100%{transform:rotate(-3deg) translateY(-3px)} 50%{transform:rotate(3deg) translateY(-3px)} }
.nutbot.shake     { animation: shake .1s linear infinite; }
@keyframes shake  { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px) rotate(-1deg)} 75%{transform:translateX(6px) rotate(1deg)} }
.nutbot.pulse     { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse  { 0%,100%{transform:translateY(-4px) scale(1)} 50%{transform:translateY(-9px) scale(1.03)} }

/* Monitor */
.monitor {
  position: relative;
  width: 200px;
  background: linear-gradient(145deg, #eae4da 0%, #cdc7bb 55%, #bcb6aa 100%);
  border: 3px solid #9c907e;
  border-radius: 22px 22px 14px 14px;
  padding: 12px 12px 9px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
}
/* inner bevel */
.monitor::before {
  content:'';
  position:absolute;inset:4px;
  border-radius:17px 17px 10px 10px;
  border-top:1.5px solid rgba(255,255,255,.32);
  border-left:1.5px solid rgba(255,255,255,.18);
  pointer-events:none;
}
/* side ears */
.ear {
  position:absolute; top:46%; transform:translateY(-50%);
  width:10px; height:26px;
  background:linear-gradient(90deg,#b8b2a6,#ccc6ba);
  border:2px solid #9c907e; border-radius:3px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22);
}
.ear-l{left:-11px} .ear-r{right:-11px}

/* Screen */
.screen {
  width:100%; height:122px;
  background:#040302;
  border-radius:11px;
  border:2.5px solid #504840;
  overflow:hidden;
  position:relative;
  box-shadow:inset 0 0 30px rgba(0,180,200,.05);
  transition:box-shadow .35s;
}
.screen.gc { box-shadow:inset 0 0 30px rgba(0,180,200,.14); }
.screen.go { box-shadow:inset 0 0 30px rgba(255,107,43,.18); }
.screen.gr { box-shadow:inset 0 0 30px rgba(255,50,50,.24); }
.screen.gp { box-shadow:inset 0 0 30px rgba(255,107,138,.18); }
.screen svg { width:100%; height:100%; display:block; }

/* Monitor foot */
.mfoot {
  width:100%;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 4px;
}
.vents{display:flex;gap:4px}
.vent{width:13px;height:4px;background:#9c907e;border-radius:2px;box-shadow:inset 0 1px 0 rgba(0,0,0,.2)}
.model-tag{font-size:.5rem;letter-spacing:.18em;color:#9c907e;text-transform:uppercase}
.mled {
  width:8px;height:8px;border-radius:50%;
  background:#00b4c8; box-shadow:0 0 6px #00b4c8;
  transition:all .3s; flex-shrink:0;
}
.mled.off   {background:#2a2418;box-shadow:none}
.mled.red   {background:#ff4040;box-shadow:0 0 6px #ff4040}
.mled.amber {background:#ff8800;box-shadow:0 0 6px #ff8800}
.mled.pink  {background:#ff6b8a;box-shadow:0 0 6px #ff6b8a}

/* Neck + base */
.neck {
  width:48px; height:14px;
  background:linear-gradient(180deg,#ccc6ba,#b8b2a6);
  border:2.5px solid #9c907e; border-top:none;
  border-radius:0 0 8px 8px;
}
.base {
  position:relative;
  width:182px; height:56px;
  background:linear-gradient(145deg,#d8d2c8 0%,#c0bab0 55%,#b6b0a4 100%);
  border:3px solid #9c907e; border-radius:11px;
  display:flex; align-items:center; padding:0 14px; gap:10px;
}
.base::before {
  content:'';position:absolute;inset:4px;border-radius:8px;
  border-top:1.5px solid rgba(255,255,255,.28);
  border-left:1.5px solid rgba(255,255,255,.14);
  pointer-events:none;
}
.drive{display:flex;flex-direction:column;gap:5px}
.drive-slot{width:58px;height:5px;background:#706860;border-radius:2.5px;box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}
.drive-label{width:42px;height:16px;background:#e2dcd0;border-radius:2px;border:1.5px solid #9c907e}
.bleds{margin-left:auto;display:flex;flex-direction:column;gap:5px}
.bled{width:6px;height:6px;border-radius:50%;background:#2a2418;transition:all .3s}
.bled.c{background:#00b4c8;box-shadow:0 0 4px #00b4c8}
.bled.o{background:#ff6b2b;box-shadow:0 0 4px #ff6b2b}
.bled.r{background:#ff4040;box-shadow:0 0 4px #ff4040}
.bled.p{background:#ff6b8a;box-shadow:0 0 4px #ff6b8a}

/* ─── Controls ────────────────────────────────────── */
.section-label{font-size:.58rem;letter-spacing:.16em;color:#8b8475;text-transform:uppercase}
.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:560px}
.btn {
  padding:7px 16px;
  background:#1e1a14; border:1.5px solid #3d3220; border-radius:10px;
  color:#8b8475; font-family:inherit; font-size:.68rem; cursor:pointer;
  box-shadow:3px 3px 0 #070604; text-transform:uppercase; letter-spacing:.1em;
  display:inline-flex; align-items:center; gap:7px;
  transition:color .12s,border-color .12s,background .12s;
  user-select:none;
}
.btn:hover  {border-color:#ff6b2b;color:#ff6b2b;background:#201c15}
.btn:active {transform:translate(1px,1px);box-shadow:2px 2px 0 #070604}
.btn.active {border-color:#00b4c8;color:#00b4c8;background:#071010}
.cur{font-size:.62rem;letter-spacing:.12em;color:#9f9887;text-transform:uppercase}
.cur span{color:#00b4c8}
.hint{font-size:.52rem;color:#3d3830;letter-spacing:.1em}
</style>
</head>
<body>

<div class="title">NutBot · Expression Lab</div>

<div class="nutbot" id="nutbot">
  <div class="monitor">
    <div class="ear ear-l"></div>
    <div class="ear ear-r"></div>

    <div class="screen" id="screen">
      <svg id="fsvg" viewBox="0 0 160 122" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="gc" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="2.6" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="gw" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="2.8" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="gr" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="3.5" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <pattern id="sl" x="0" y="0" width="160" height="3" patternUnits="userSpaceOnUse">
            <rect width="160" height="1" fill="white" opacity=".024"/>
          </pattern>
        </defs>

        <!-- bar eyes — animated by JS each frame -->
        <rect id="el" rx="4.5" ry="4.5" filter="url(#gc)"/>
        <rect id="er" rx="4.5" ry="4.5" filter="url(#gc)"/>

        <!-- special eye shapes (arcs / hearts / X) — shown per expression -->
        <g id="se"></g>

        <!-- brows, mouth, effects — innerHTML set per expression/frame -->
        <g id="bw"></g>
        <g id="mo"></g>
        <g id="fx"></g>

        <!-- scanlines + glare always on top -->
        <rect width="160" height="122" fill="url(#sl)" pointer-events="none"/>
        <ellipse cx="133" cy="18" rx="20" ry="9" fill="white" opacity=".03"
          transform="rotate(-22 133 18)" pointer-events="none"/>
      </svg>
    </div>

    <div class="mfoot">
      <div class="vents">
        <div class="vent"></div><div class="vent"></div>
        <div class="vent"></div><div class="vent"></div>
      </div>
      <div class="model-tag">NUT-B0T</div>
      <div class="mled" id="mled"></div>
    </div>
  </div>
  <div class="neck"></div>
  <div class="base">
    <div class="drive">
      <div class="drive-slot"></div>
      <div class="drive-label"></div>
    </div>
    <div class="bleds">
      <div class="bled c"></div>
      <div class="bled o"></div>
      <div class="bled" id="bled3"></div>
    </div>
  </div>
</div>

<div class="section-label">expressions</div>
<div class="controls" id="controls"></div>
<div class="cur">current: <span id="cur-name">idle</span></div>
<div class="hint">← → arrow keys to cycle expressions</div>

<script>
/* ─────────────── refs & constants ───────────────────── */
const EL  = document.getElementById('el');   // left bar eye
const ER  = document.getElementById('er');   // right bar eye
const SE  = document.getElementById('se');   // special eyes (arcs, hearts, X)
const BW  = document.getElementById('bw');   // brows
const MO  = document.getElementById('mo');   // mouth
const FX  = document.getElementById('fx');   // effects

const C = '#00b4c8', O = '#ff6b2b', R = '#ff4040', P = '#ff6b8a';

// Default bar eye anchors (cx, cy) — bars are w=14 h=28
const LX=52, RX=108, EY=52, EW=14, EH=28;

/* ─────────────── low-level helpers ──────────────────── */
function setBar(el, cx, cy, w, h, color=C, rx=4.5) {
  el.setAttribute('x',      (cx - w/2).toFixed(2));
  el.setAttribute('y',      (cy - h/2).toFixed(2));
  el.setAttribute('width',  Math.max(0, w).toFixed(2));
  el.setAttribute('height', Math.max(0.5, h).toFixed(2));
  el.setAttribute('fill',   color);
  el.setAttribute('rx', rx); el.setAttribute('ry', rx);
}

function showBars()  { EL.style.display=''; ER.style.display=''; }
function hideBars()  { EL.style.display='none'; ER.style.display='none'; }
function clearAll()  { SE.innerHTML=''; BW.innerHTML=''; MO.innerHTML=''; FX.innerHTML=''; }

const lerp  = (a,b,t) => a+(b-a)*Math.min(1,Math.max(0,t));
const clamp = (v,lo,hi) => Math.min(hi,Math.max(lo,v));
const easeOut= t => 1-Math.pow(1-t,2.5);
const easeIO = t => t<.5?2*t*t:-1+(4-2*t)*t;

/* ─────────────── SVG fragment builders ──────────────── */
function arcEye(cx, cy, fill=C) {
  // Thick crescent ^^ eye: outer arc bows way up, inner arc slightly up → lens shape
  const w=17, outer=15, inner=4;
  return `<path d="M${cx-w} ${cy} Q${cx} ${cy-outer} ${cx+w} ${cy}
    Q${cx} ${cy-inner} ${cx-w} ${cy}Z"
    fill="${fill}" filter="url(#gc)"/>`;
}

function heartEye(cx,cy,s=.85,fill=P) {
  const p=(dx,dy)=>`${cx+dx*s} ${cy+dy*s}`;
  return `<path d="M${p(0,-8)} C${p(0,-8)} ${p(-5,-15)} ${p(-10,-10)}
    C${p(-15,-5)} ${p(-15,0)} ${p(-9,6)} L${p(0,14)} L${p(9,6)}
    C${p(15,0)} ${p(15,-5)} ${p(10,-10)} C${p(5,-15)} ${p(0,-8)} ${p(0,-8)}Z"
    fill="${fill}" filter="url(#gw)"/>`;
}

function xEye(cx,cy,fill=R,op=1) {
  const s=22, t=s*.19;
  return `
    <rect x="${cx-s/2}" y="${cy-t/2}" width="${s}" height="${t}" rx="${t/2}"
      fill="${fill}" opacity="${op}" transform="rotate(45,${cx},${cy})" filter="url(#gr)"/>
    <rect x="${cx-s/2}" y="${cy-t/2}" width="${s}" height="${t}" rx="${t/2}"
      fill="${fill}" opacity="${op}" transform="rotate(-45,${cx},${cy})" filter="url(#gr)"/>`;
}

function smile(y=91,w=26,up=true,fill=C) {
  // up=true → control BELOW endpoints → U shape → smile
  // up=false → control ABOVE endpoints → ∩ shape → frown
  const cy = up ? y+11 : y-11;
  return `<path d="M${80-w} ${y} Q80 ${cy} ${80+w} ${y}"
    fill="none" stroke="${fill}" stroke-width="3.5" stroke-linecap="round"
    filter="url(#gc)"/>`;
}

function blush(fill=O) {
  return `<ellipse cx="26" cy="80" rx="13" ry="7" fill="${fill}" opacity=".22"/>
          <ellipse cx="134" cy="80" rx="13" ry="7" fill="${fill}" opacity=".22"/>`;
}

/* ─────────────── look-around helper ─────────────────── */
// returns dx [-max,+max] for a slow pan-left / hold / pan-right / hold cycle
function lookCycle(t, period=9, max=8) {
  const c = (t % period) / period;
  if (c < .11) return 0;
  if (c < .19) return lerp(0, -max, easeIO((c-.11)/.08));
  if (c < .37) return -max;
  if (c < .45) return lerp(-max, 0, easeIO((c-.37)/.08));
  if (c < .57) return 0;
  if (c < .65) return lerp(0, max, easeIO((c-.57)/.08));
  if (c < .83) return max;
  if (c < .91) return lerp(max, 0, easeIO((c-.83)/.08));
  return 0;
}

/* ─────────────── expressions ────────────────────────── */
/*
  Each expression has:
    label, icon      — UI
    led, screen, anim, ledB3 — DOM side-effects on enter
    onEnter()        — called once when expression activates
    tick(t)          — called every frame; t = seconds since expression started
*/
const EXPRS = {

  idle: {
    label:'Idle', icon:'◉', led:'', screen:'', anim:'',
    onEnter() { clearAll(); showBars(); },
    tick(t) {
      if (isBlinking) return;
      const dx = lookCycle(t);
      setBar(EL, LX+dx, EY, 18, 34);
      setBar(ER, RX+dx, EY, 18, 34);
    },
    blink: true,
  },

  happy: {
    label:'Happy', icon:'◡', led:'', screen:'gc', anim:'',
    onEnter() { clearAll(); hideBars(); FX.innerHTML = blush(O); },
    tick(t) {
      // Squinted bars tilted inward — bars lean toward each other like "> <"
      // combined with a warm smile. Eyes gently pulse with the breathing rhythm.
      const pulse = Math.sin(t*2.8)*1.4;
      const h = 13 + pulse;
      const w = 15;
      const angle = 16;
      const cy = EY - 2;
      SE.innerHTML = `
        <rect x="${LX-w/2}" y="${cy-h/2}" width="${w}" height="${h}" rx="4.5"
          fill="${C}" filter="url(#gc)"
          transform="rotate(-${angle} ${LX} ${cy})"/>
        <rect x="${RX-w/2}" y="${cy-h/2}" width="${w}" height="${h}" rx="4.5"
          fill="${C}" filter="url(#gc)"
          transform="rotate(${angle} ${RX} ${cy})"/>`;
      MO.innerHTML = smile(91 + pulse*0.25, 27, true);
    },
  },

  annoyed: {
    label:'Annoyed', icon:'¬', led:'', screen:'', anim:'',
    onEnter() { clearAll(); showBars(); },
    tick(t) {
      // Quick impatient side-glances: left–right–left–center repeat
      const c = (t % 1.8);
      let dx;
      if      (c < .14) dx = -10;
      else if (c < .44) dx = -10;
      else if (c < .58) dx = lerp(-10, 10, (c-.44)/.14);
      else if (c < .9 ) dx = 10;
      else if (c < 1.04) dx = lerp(10, 0, (c-.9)/.14);
      else               dx = 0;

      const h = 18 + Math.sin(t*6)*.8;
      setBar(EL, LX+dx, EY, EW, h);
      setBar(ER, RX+dx, EY, EW, h);

      // Furrowed brows that follow eye movement slightly
      const bx = dx*.25;
      BW.innerHTML = `
        <line x1="${34+bx}" y1="32" x2="${58+bx}" y2="39"
          stroke="${C}" stroke-width="2.8" stroke-linecap="round" opacity=".72"/>
        <line x1="${102+bx}" y1="39" x2="${126+bx}" y2="32"
          stroke="${C}" stroke-width="2.8" stroke-linecap="round" opacity=".72"/>`;
    },
  },

  excited: {
    label:'Excited', icon:'★', led:'amber', screen:'go', anim:'bounce',
    onEnter() { clearAll(); showBars(); FX.innerHTML = blush(O)
      + `<circle cx="20" cy="32" r="3" fill="${O}" opacity=".5" filter="url(#gw)"/>`
      + `<circle cx="140" cy="32" r="3" fill="${O}" opacity=".5" filter="url(#gw)"/>`;
    },
    tick(t) {
      const pulse = 1 + Math.sin(t*9)*.18;
      setBar(EL, LX, EY, EW*pulse, EH*pulse, O, 4.5);
      setBar(ER, RX, EY, EW*pulse, EH*pulse, O, 4.5);
      MO.innerHTML = smile(92, 27, true, O);
    },
  },

  sleepy: {
    label:'Sleepy', icon:'zzz', led:'off', screen:'', anim:'',
    onEnter() { clearAll(); showBars(); },
    tick(t) {
      // Slowly drooping eyes: close → stay closed → half-open → repeat
      const phase = (t % 5) / 5;
      let h;
      if      (phase < .35) h = lerp(EH, 4,  easeIO(phase/.35));
      else if (phase < .55) h = 4;
      else if (phase < .75) h = lerp(4, 12,  easeIO((phase-.55)/.2));
      else                  h = 12;

      // Eyes slide down slightly as they close
      const dy = lerp(0, 5, (EH - Math.max(h,0)) / EH);
      setBar(EL, LX, EY+dy, EW, h);
      setBar(ER, RX, EY+dy, EW, h);

      // ZZZ float upward and fade
      const zt = (t % 3.2) / 3.2;
      FX.innerHTML = `
        <text x="116" y="${40 - zt*14}" font-size="11" font-family="monospace"
          fill="${C}" opacity="${clamp(1-zt*.7,0,1)}" filter="url(#gc)">z</text>
        <text x="126" y="${27 - zt*9}" font-size="9" font-family="monospace"
          fill="${C}" opacity="${clamp(.7-zt*.6,0,1)}">z</text>
        <text x="134" y="${17 - zt*5}" font-size="7" font-family="monospace"
          fill="${C}" opacity="${clamp(.4-zt*.35,0,1)}">z</text>`;
    },
  },

  surprised: {
    label:'Surprised', icon:'!!', led:'', screen:'gc', anim:'',
    onEnter() { clearAll(); showBars(); },
    tick(t) {
      // Snap wide on entry, then gentle breathing
      const entry = Math.min(t / .25, 1);
      const breath = Math.sin(t*1.6)*.5;
      const w = lerp(EW, EW*1.9, easeOut(entry)) + breath;
      const h = lerp(EH, EH*1.75, easeOut(entry)) + breath;
      setBar(EL, LX, EY, w, h);
      setBar(ER, RX, EY, w, h);
      // O mouth
      MO.innerHTML = `<ellipse cx="80" cy="95" rx="9" ry="${11+breath}"
        fill="${C}" opacity=".44" filter="url(#gc)"/>`;
    },
  },

  thinking: {
    label:'Thinking', icon:'…', led:'', screen:'', anim:'tilt',
    onEnter() { clearAll(); showBars(); },
    tick(t) {
      // Left eye squints slowly; both drift up-right
      const sq = Math.min(t/.7, 1);
      const lh = lerp(EH, 9, easeOut(sq));
      const drift = Math.sin(t*.45)*2.5;

      setBar(EL, LX+drift, EY-3, EW, lh);
      setBar(ER, RX+drift, EY-3, EW, EH);

      // Pulsing thought dots in sequence
      const d1 = .5 + Math.sin(t*4.2)*.4;
      const d2 = .5 + Math.sin(t*4.2 - 1.3)*.4;
      const d3 = .5 + Math.sin(t*4.2 - 2.6)*.4;
      BW.innerHTML = `
        <circle cx="109" cy="22" r="5"   fill="${C}" opacity="${d1}" filter="url(#gc)"/>
        <circle cx="121" cy="14" r="3.8" fill="${C}" opacity="${d2}"/>
        <circle cx="131" cy="7"  r="2.6" fill="${C}" opacity="${d3}"/>`;
    },
  },

  focused: {
    label:'Focused', icon:'◈', led:'', screen:'gc', anim:'',
    onEnter() { clearAll(); showBars(); },
    tick(t) {
      // Narrow bars, sharp locked-forward gaze, subtle scan then snap back
      const scanT = (t % 6);
      let dx = 0;
      if (scanT > 4 && scanT < 4.15) dx = lerp(0, -6, (scanT-4)/.15);
      else if (scanT >= 4.15 && scanT < 5) dx = -6;
      else if (scanT >= 5 && scanT < 5.15) dx = lerp(-6, 0, (scanT-5)/.15);

      const h = EH + Math.sin(t*1.2)*.5;
      setBar(EL, LX+dx, EY, 11, h);
      setBar(ER, RX+dx, EY, 11, h);

      BW.innerHTML = `
        <line x1="${37+dx*.3}" y1="33" x2="${57+dx*.3}" y2="39"
          stroke="${C}" stroke-width="2.5" stroke-linecap="round" opacity=".65"/>
        <line x1="${103+dx*.3}" y1="39" x2="${123+dx*.3}" y2="33"
          stroke="${C}" stroke-width="2.5" stroke-linecap="round" opacity=".65"/>`;
      MO.innerHTML = `<line x1="62" y1="91" x2="98" y2="91"
        stroke="${C}" stroke-width="3" stroke-linecap="round" opacity=".42"/>`;
    },
  },

  error: {
    label:'Error', icon:'×', led:'red', screen:'gr', anim:'shake',
    ledB3:'r',
    onEnter() { clearAll(); hideBars(); },
    tick(t) {
      // X eyes jitter randomly each frame
      const flicker = Math.random() > .12 ? 1 : 0;
      const jx = (Math.random()-.5)*7;
      const jy = (Math.random()-.5)*4;
      SE.innerHTML = xEye(LX+jx, EY+jy, R, flicker) + xEye(RX-jx, EY-jy, R, flicker);

      // Glitch lines + error text
      MO.innerHTML = `
        <text x="40" y="96" font-size="8.5" font-family="monospace"
          fill="${R}" opacity="${.7+Math.random()*.3}" filter="url(#gr)">ERR_0xNULL</text>
        <rect x="${Math.random()*50}" y="66"
          width="${25+Math.random()*55}" height="2.5"
          fill="${R}" opacity="${Math.random()*.14}"/>`;
    },
  },

  love: {
    label:'Love', icon:'♥', led:'pink', screen:'gp', anim:'pulse',
    ledB3:'p',
    onEnter() { clearAll(); hideBars(); FX.innerHTML = blush(P); },
    tick(t) {
      const s = .78 + Math.sin(t*2.4)*.11;
      SE.innerHTML = heartEye(LX, EY+1, s) + heartEye(RX, EY+1, s);
      MO.innerHTML = smile(93, 25, true, P);
    },
  },

  nervous: {
    label:'Nervous', icon:'~', led:'', screen:'', anim:'',
    onEnter() { clearAll(); showBars(); },
    tick(t) {
      // Eyes dart erratically using overlapping sine waves
      const dx = Math.sin(t*13.7)*7 + Math.sin(t*8.3)*4;
      const dy = Math.sin(t*11.1)*3 + Math.sin(t*6.7)*2;
      setBar(EL, LX+dx, EY+dy, EW, EH);
      setBar(ER, RX+dx, EY+dy, EW, EH);

      // Animated sweat drop
      const drip = (t % 2.5) / 2.5;
      FX.innerHTML = `
        <ellipse cx="143" cy="${27+drip*10}" rx="4" ry="${5+drip*2}"
          fill="${C}" opacity="${clamp(.7-drip*.4,0,1)}" filter="url(#gc)"/>
        <path d="M139 ${27+drip*10} Q143 ${17+drip*8} 147 ${27+drip*10}"
          fill="${C}" opacity="${clamp(.7-drip*.4,0,1)}" filter="url(#gc)"/>`;
    },
  },

  bored: {
    label:'Bored', icon:'—', led:'off', screen:'', anim:'',
    onEnter() { clearAll(); showBars(); },
    tick(t) {
      // Eyes slowly scan side to side, very languid
      const dx = lookCycle(t, 14, 9); // longer period, slightly bigger range
      // Eyes also sag downward
      const dy = 4 + Math.sin(t*.6)*1;
      // Partially closed (bored squint)
      const h = 14 + Math.sin(t*.4)*1.2;
      setBar(EL, LX+dx, EY+dy, EW, h);
      setBar(ER, RX+dx, EY+dy, EW, h);
      // Flat/slight frown mouth
      MO.innerHTML = smile(93, 20, false);
    },
  },
};

/* ─────────────── blink system ───────────────────────── */
let isBlinking = false;
let blinkTimer  = null;

function scheduleBlink() {
  clearTimeout(blinkTimer);
  blinkTimer = setTimeout(async () => {
    if (currentKey !== 'idle') return;
    isBlinking = true;
    setBar(EL, LX, EY, 18, 5);
    setBar(ER, RX, EY, 18, 5);
    await new Promise(r => setTimeout(r, 105));
    isBlinking = false;
    scheduleBlink();
  }, 2000 + Math.random()*3500);
}

/* ─────────────── animation loop ─────────────────────── */
let startTime   = null;
let currentKey  = 'idle';

function tick(ts) {
  if (!startTime) startTime = ts;
  EXPRS[currentKey]?.tick((ts - startTime) / 1000);
  requestAnimationFrame(tick);
}

/* ─────────────── expression switcher ────────────────── */
function switchTo(key) {
  currentKey = key;
  startTime  = null;
  clearTimeout(blinkTimer);
  isBlinking = false;

  const ex = EXPRS[key];
  document.getElementById('mled').className    = 'mled'  + (ex.led  ? ` ${ex.led}`  : '');
  document.getElementById('bled3').className   = 'bled'  + (ex.ledB3? ` ${ex.ledB3}`: '');
  document.getElementById('screen').className  = 'screen'+ (ex.screen?` ${ex.screen}`:'');
  document.getElementById('nutbot').className  = 'nutbot'+ (ex.anim ? ` ${ex.anim}` : '');
  document.getElementById('cur-name').textContent = key;

  ex.onEnter?.();
  if (ex.blink) scheduleBlink();
}

/* ─────────────── build buttons ──────────────────────── */
const container = document.getElementById('controls');
Object.entries(EXPRS).forEach(([key, ex]) => {
  const btn = document.createElement('button');
  btn.className = 'btn' + (key==='idle' ? ' active' : '');
  btn.id = `btn-${key}`;
  btn.innerHTML = `<span>${ex.icon}</span>${ex.label}`;
  btn.onclick = () => {
    document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    switchTo(key);
  };
  container.appendChild(btn);
});

const exKeys = Object.keys(EXPRS);
document.addEventListener('keydown', e => {
  if (['ArrowRight','ArrowDown'].includes(e.key)) {
    const i = (exKeys.indexOf(currentKey)+1) % exKeys.length;
    document.getElementById(`btn-${exKeys[i]}`).click();
  }
  if (['ArrowLeft','ArrowUp'].includes(e.key)) {
    const i = (exKeys.indexOf(currentKey)-1+exKeys.length) % exKeys.length;
    document.getElementById(`btn-${exKeys[i]}`).click();
  }
});

switchTo('idle');
requestAnimationFrame(tick);
</script>
